<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إتمام الطلب | زمزم</title>
    <meta name="description" content="إرسال طلبك من متجر زمزم وتأكيد البيانات قبل التواصل عبر واتساب." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/css/checkout.css" />
  </head>
  <body>
    <div class="checkout-shell">
      <header class="checkout-header">
        <a href="index.html" class="back-link" aria-label="العودة إلى المتجر">← العودة</a>
        <h1>إتمام الطلب</h1>
      </header>

      <main class="checkout-layout">
        <section class="checkout-panel">
          <div class="panel-head">
            <h2>بيانات العميل</h2>
          </div>

          <form id="checkoutForm" class="checkout-form">
            <div class="field-grid">
              <label>
                الاسم الأول
                <input name="firstName" type="text" placeholder="مثال: محمد" required />
              </label>

              <label>
                الاسم الأخير
                <input name="lastName" type="text" placeholder="مثال: علي" required />
              </label>

              <label>
                رقم الهاتف
                <input name="phone" type="tel" placeholder="9665xxxxxxxx" required />
              </label>

              <label>
                البريد الإلكتروني
                <input name="email" type="email" placeholder="example@mail.com" />
              </label>

              <label>
                المحافظة
                <input name="governorate" type="text" placeholder="الجيزة" required />
              </label>

              <label>
                المدينة / المنطقة
                <input name="city" type="text" placeholder="الدقي" required />
              </label>

              <label class="full">
                عنوان الشارع
                <input name="address" type="text" placeholder="شارع ..." required />
              </label>

              <label>
                المبنى
                <input name="building" type="text" placeholder="اسم المبنى / رقم المبنى" />
              </label>

              <label>
                الطابق
                <input name="floor" type="text" placeholder="المستوى" />
              </label>

              <label>
                الشقة
                <input name="apartment" type="text" placeholder="رقم الشقة" />
              </label>

              <label class="full">
                ملاحظات إضافية
                <textarea name="notes" rows="3" placeholder="أي ملاحظات إضافية عن الطلب"></textarea>
              </label>
            </div>

            <button type="submit" class="submit-btn">إتمام الطلب عبر واتساب</button>
          </form>
        </section>

        <aside class="summary-panel">
          <div class="panel-head">
            <h2>ملخص الطلب</h2>
          </div>

          <div id="checkoutItems" class="checkout-items"></div>

          <div class="totals">
            <div class="row">
              <span>المجموع الفرعي</span>
              <strong id="checkoutSubtotal">0 ج.م</strong>
            </div>
            <div class="row">
              <span>التوصيل</span>
              <strong id="checkoutShipping">0 ج.م</strong>
            </div>
            <div class="row total">
              <span>الإجمالي</span>
              <strong id="checkoutTotal">0 ج.م</strong>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="src/js/checkout.js"></script>
  </body>
</html>
