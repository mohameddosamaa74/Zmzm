<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إتمام الطلب | زمزم</title>
    <meta name="description" content="إرسال طلبك من متجر زمزم وتأكيد البيانات قبل التواصل عبر واتساب." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/css/checkout.css" />
    <link rel="stylesheet" href="src/css/cart-icon.css" />
    <link rel="stylesheet" href="src/css/shipping.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html" aria-label="زمزم، الصفحة الرئيسية">
          <span class="logo-mark">Z</span>
          <span>زمزم</span>
        </a>
        <nav class="main-nav" aria-label="التنقل الرئيسي">
          <a href="index.html">الرئيسية</a>
          <a href="index.html#shop">المتجر</a>
          <a href="index.html#about">عن زمزم</a>
          <a href="index.html#contact">تواصل معنا</a>
        </nav>
        <div class="header-actions">
          <a class="header-icon cart-toggle" href="index.html#shop" aria-label="العودة إلى المتجر">
            <svg class="cart-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3.25 4.5h1.1c.58 0 1.08.4 1.21.97l2.32 10.42a2 2 0 0 0 1.95 1.57h8.33a2 2 0 0 0 1.94-1.51L22 8H6.1" />
              <circle cx="10" cy="20" r="1.15" />
              <circle cx="18" cy="20" r="1.15" />
            </svg>
            <b id="cartCount">0</b>
          </a>
        </div>
      </div>
    </header>

    <div class="checkout-shell">
      <header class="checkout-header">
        <a href="index.html" class="back-link" aria-label="العودة إلى المتجر">العودة <span aria-hidden="true">→</span></a>
        <h1>إتمام الطلب</h1>
      </header>

      <main class="checkout-layout">
        <section class="checkout-panel">
          <div class="panel-head">
            <h2>بيانات العميل</h2>
          </div>

          <form id="checkoutForm" class="checkout-form">
            <div class="field-grid">
              <label>
                الاسم الأول
                <input name="firstName" type="text" placeholder="مثال: محمد" required />
              </label>

              <label>
                الاسم الأخير
                <input name="lastName" type="text" placeholder="مثال: علي" required />
              </label>

              <label>
                رقم الهاتف
                <input
                  name="phone"
                  type="tel"
                  inputmode="numeric"
                  pattern="01[0125][0-9]{8}"
                  maxlength="11"
                  minlength="11"
                  placeholder="01012345678"
                  title="يرجى إدخال رقم هاتف مصري صالح مكون من 11 رقمًا يبدأ بـ 01"
                  required
                />
              </label>

              <label>
                المحافظة
                <div class="select-wrap">
                  <select name="governorate" required>
                    <option value="">اختر المحافظة</option>
                    <option value="القاهرة">القاهرة</option>
                    <option value="الإسكندرية">الإسكندرية</option>
                    <option value="الإسماعيلية">الإسماعيلية</option>
                    <option value="الأقصر">الأقصر</option>
                    <option value="البحيرة">البحيرة</option>
                    <option value="بني سويف">بني سويف</option>
                    <option value="بورسعيد">بورسعيد</option>
                    <option value="الجيزة">الجيزة</option>
                    <option value="الدقهلية">الدقهلية</option>
                    <option value="جنوب سيناء">جنوب سيناء</option>
                    <option value="دمياط">دمياط</option>
                    <option value="سوهاج">سوهاج</option>
                    <option value="السويس">السويس</option>
                    <option value="الشرقية">الشرقية</option>
                    <option value="شمال سيناء">شمال سيناء</option>
                    <option value="الغربية">الغربية</option>
                    <option value="الفيوم">الفيوم</option>
                    <option value="القليوبية">القليوبية</option>
                    <option value="قنا">قنا</option>
                    <option value="كفر الشيخ">كفر الشيخ</option>
                    <option value="مطروح">مطروح</option>
                    <option value="المنيا">المنيا</option>
                    <option value="المنوفية">المنوفية</option>
                    <option value="الوادي الجديد">الوادي الجديد</option>
                    <option value="أسوان">أسوان</option>
                    <option value="أسيوط">أسيوط</option>
                    <option value="البحر الأحمر">البحر الأحمر</option>
                  </select>
                </div>
              </label>

              <label>
                المدينة / المنطقة
                <input name="city" type="text" placeholder="الدقي" required />
              </label>

              <label class="full">
                عنوان الشارع
                <input name="address" type="text" placeholder="شارع ..." required />
              </label>

              <label>
                المبنى
                <input name="building" type="text" placeholder="اسم المبنى / رقم المبنى" required />
              </label>

              <label>
                الطابق
                <input name="floor" type="text" placeholder="المستوى" required />
              </label>

              <label>
                الشقة
                <input name="apartment" type="text" placeholder="رقم الشقة" required />
              </label>

              <label class="full">
                ملاحظات إضافية
                <textarea name="notes" rows="3" placeholder="أي ملاحظات إضافية عن الطلب"></textarea>
              </label>
            </div>

            <div class="mobile-checkout-totals" aria-label="تكلفة الطلب">
              <h3>تكلفة الطلب</h3>
              <div class="row">
                <span>المجموع الفرعي</span>
                <strong id="mobileCheckoutSubtotal">0 ج.م</strong>
              </div>
              <div class="row">
                <span>التوصيل</span>
                <strong id="mobileCheckoutShipping">0 ج.م</strong>
              </div>
              <div class="row total">
                <span>الإجمالي</span>
                <strong id="mobileCheckoutTotal">0 ج.م</strong>
              </div>
              <p id="mobileCheckoutDeliveryNote" class="delivery-note">مدة التوصيل من 2 إلى 5 أيام.</p>
            </div>

            <button type="submit" class="submit-btn" disabled>إتمام الطلب عبر واتساب</button>
          </form>
        </section>

        <aside class="summary-panel">
          <div class="panel-head">
            <h2>ملخص الطلب</h2>
          </div>

          <div id="checkoutItems" class="checkout-items"></div>

          <div class="totals">
            <div class="row">
              <span>المجموع الفرعي</span>
              <strong id="checkoutSubtotal">0 ج.م</strong>
            </div>
            <div class="row">
              <span>التوصيل</span>
              <strong id="checkoutShipping">0 ج.م</strong>
            </div>
            <div class="row total">
              <span>الإجمالي</span>
              <strong id="checkoutTotal">0 ج.م</strong>
            </div>
            <p id="checkoutDeliveryNote" class="delivery-note">مدة التوصيل من 2 إلى 5 أيام.</p>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="src/js/checkout.js"></script>
  </body>
</html>
